[wondergateway]
; Transport: "stdio" for Mednafen (wswan.excomm), or "serial" for real hardware.
transport = stdio

; Only used when transport = serial:
comport = COM13

; Serial baud: 9600 or 38400.
baud = 9600

; PDC reception bars, 0-15.
reception = 15

; Cosmetic only - the call is always simulated as accepted.
dialnumber = 0000000000

; Set debug = 0 to silence the stderr logging.
debug = 1

; Mirror all logging to a file (relative paths resolve next to the exe).
; Useful under Mednafen, which may not show the child process's stderr.
logfile = wondergateway.log

[ppp]
; Informational only - the gateway accepts any login.
user = wonder
pass = gate

; Redirect the (long-dead) mopera servers to something you control.
; The right-hand side may be an IP or a hostname. Point these at a local
; HTTP server to watch the browser actually fetch a page.
[hostname_hack]
*.mopera.ne.jp = 127.0.0.1
*.channel.or.jp = 127.0.0.1

; Alternatively redirect by IP[:port] -> IP[:port], e.g.:
[socket_hack]
; 1.2.3.4:80 = 127.0.0.1:8080
